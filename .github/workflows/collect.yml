name: 입찰공고 수집

on:
  schedule:
    - cron: "0 22 * * *"    # 매일 07:00 KST
    - cron: "0 3 * * 1-5"   # 평일 12:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bid-monitor-github
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          TZ: Asia/Seoul
      - name: 페이지 복사 및 커밋
        run: |
          mkdir -p ../docs
          cp docs/index.html ../docs/index.html
          git config user.name "bid-bot"
          git config user.email "bid-bot@users.noreply.github.com"
          git add docs/ ../docs/
          git diff --cached --quiet || git commit -m "공고 갱신 $(date +'%Y-%m-%d %H:%M')"
          git push
