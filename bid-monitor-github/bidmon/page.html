<style>
:root{
  --ink:#1c2430; --ink-2:#5b6672; --ink-3:#98a2ad; --line:#e3e7ec; --paper:#fff; --wash:#f5f7f9;
  --lh:#0e6b5e; --gh:#3b4ba6; --ih:#8a4f9e; --sh:#a35a1c; --urgent:#c0392b; --pre:#6a5b2b; --ok:#1e7a4a; --new:#1e7a4a;
}
*{box-sizing:border-box}
html{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:15px;line-height:1.45}
body{margin:0}
header{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);z-index:2}
.bar{max-width:1120px;margin:0 auto;padding:12px 20px 8px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
#btnSearch{margin-left:-10px}
.bar+.bar{padding-top:0}
h1{font-size:19px;font-weight:700;margin:0 10px 0 0;letter-spacing:-.01em}
h1 small{font-weight:400;color:var(--ink-3);font-size:13px;margin-left:8px}
.group{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.group span.lbl{color:var(--ink-3);font-size:13px;margin-right:2px}
button{font:inherit;cursor:pointer}
button.f{border:1px solid var(--line);background:var(--paper);color:var(--ink-2);border-radius:999px;padding:3px 11px;font-size:13px}
button.f.on{background:var(--ink);border-color:var(--ink);color:#fff}
button.a{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;padding:5px 13px;font-size:13px}
button.a.q{background:var(--paper);color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gh);outline-offset:2px}
input[type=search]{border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;font-size:14px;width:240px}
label.chk{font-size:13px;color:var(--ink-2);display:flex;gap:5px;align-items:center;cursor:pointer}
.right{margin-left:auto;display:flex;gap:8px;align-items:center}
.count{color:var(--ink-3);font-size:13px}
main{max-width:1120px;margin:0 auto;padding:6px 20px 60px}
.day{margin-top:22px;padding-bottom:4px;border-bottom:1px solid var(--line);color:var(--ink-2);font-size:13px;font-weight:600}
.row{display:grid;grid-template-columns:64px 1fr;gap:0 14px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:hover{background:var(--wash)}
.dd{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1;padding-top:2px;color:var(--ink-2);text-align:right}
.dd.u{color:var(--urgent)}
.dd.x{color:var(--ink-3);font-size:14px;font-weight:500;padding-top:6px}
.dd small{display:block;font-size:11px;font-weight:400;color:var(--ink-3);margin-top:3px;letter-spacing:0}
.t{font-size:15.5px;font-weight:600;text-decoration:none;color:var(--ink)}
.t:hover{text-decoration:underline}
.m{margin-top:3px;font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 14px}
.m .cat{color:var(--ink-3)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:4px;color:#fff;margin-right:6px;vertical-align:2px}
.tag.LH{background:var(--lh)}.tag.GH{background:var(--gh)}.tag.IH{background:var(--ih)}.tag.SH{background:var(--sh)}
.tag.pre{background:transparent;color:var(--pre);border:1px solid var(--pre)}
.tag.new{background:transparent;color:var(--new);border:1px solid var(--new);font-weight:600}
.empty{padding:60px 0;text-align:center;color:var(--ink-3)}
#panel{display:none;border-bottom:1px solid var(--line);background:var(--wash)}
#panel.open{display:block}
.pin{max-width:1120px;margin:0 auto;padding:14px 20px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pin h2{font-size:14px;margin:0 0 6px;font-weight:600}
.pin p{margin:0 0 8px;font-size:12.5px;color:var(--ink-2)}
textarea{width:100%;height:170px;font:inherit;font-size:13px;line-height:1.5;border:1px solid var(--line);border-radius:6px;padding:8px 10px;resize:vertical;background:var(--paper)}
.pin .act{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg{font-size:13px;color:var(--ok)}
.note{font-size:12.5px;color:var(--ink-3);grid-column:1/-1}
@media (max-width:720px){.row{grid-template-columns:52px 1fr}.dd{font-size:18px}input[type=search]{width:100%}.pin{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="bar">
  <h1>입찰공고<small id="asof">__DATE__ 갱신</small></h1>
  <input type="search" id="q" placeholder="공고명 검색 후 엔터"><button class="a q" id="btnSearch">검색</button>
  <label class="chk"><input type="checkbox" id="matched">관심 공고만</label>
  <label class="chk"><input type="checkbox" id="open" checked>마감 지난 것 숨기기</label>
  <div class="right">
    <span class="count" id="count"></span>
    <button class="a q" id="btnKw">내 관심 키워드</button>
  </div>
</div>
<div class="bar">
  <div class="group" id="cats"><span class="lbl">구분</span>
    <button class="f on" data-cat="">전체</button><button class="f" data-cat="공공기관">공공기관</button><button class="f" data-cat="지자체">지자체</button><button class="f" data-cat="중앙정부">중앙정부</button><button class="f" data-cat="교육기관">교육기관</button><button class="f" data-cat="기타">기타</button>
  </div>
  <div class="group" id="tags"><span class="lbl">기관</span>
    <button class="f on" data-tag="">전체</button><button class="f" data-tag="LH">LH</button><button class="f" data-tag="GH">GH</button><button class="f" data-tag="IH">IH</button><button class="f" data-tag="SH">SH</button>
  </div>
  <div class="group" id="kinds"><span class="lbl">종류</span>
    <button class="f on" data-kind="">전체</button><button class="f" data-kind="bid">입찰공고</button><button class="f" data-kind="pre">사전규격</button>
  </div>
</div>
<div id="panel"><div class="pin">
  <div><h2>포함 키워드</h2><p>공고명에 하나라도 있으면 관심 공고. 한 줄에 하나.</p><textarea id="kwInc"></textarea></div>
  <div><h2>제외 키워드</h2><p>공고명에 있으면 제외. 한 줄에 하나.</p><textarea id="kwExc"></textarea></div>
  <div class="act">
    <button class="a" id="btnSave">저장</button>
    <button class="a q" id="btnReset">회사 기본값으로</button>
    <button class="a q" id="btnClose">닫기</button>
    <span class="msg" id="kwMsg"></span>
  </div>
  <div class="note">키워드와 필터는 이 브라우저에만 저장됩니다. 다른 PC나 브라우저에서는 기본값부터 시작합니다.</div>
</div></div>
</header>
<main id="list"></main>
<script>
const DATA=__DATA__;
const DEFAULT_KW=__KW__;
const BUILT="__NOW__";
const NOW=new Date(BUILT);
const LS_KW="bidmon.kw", LS_S="bidmon.filters";
const $=id=>document.getElementById(id);
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
let KW=load(LS_KW,DEFAULT_KW);
const S=Object.assign({q:"",cat:"",tag:"",kind:"",matched:false,open:true},load(LS_S,{}));
const norm=s=>String(s||"").replace(/\s/g,"");
const fmtWon=v=>v?Math.round(v/1e6).toLocaleString()+"백만":"";
const dday=c=>{if(!c)return null;const d=new Date(c.replace(" ","T"));return Math.floor((d-NOW)/864e5);};
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function judge(n){
  const t=norm(n.title);
  const inc=KW.include.filter(k=>k&&t.includes(norm(k)));
  const exc=KW.exclude.some(k=>k&&t.includes(norm(k)));
  n.matched=inc.length>0&&!exc;
  n.mk=[...new Set(inc.map(norm))].join(",");
}
function judgeAll(){DATA.forEach(judge);}
function render(){
  const q=norm(S.q).toLowerCase();
  const rows=DATA.filter(n=>{
    if(S.matched&&!n.matched)return false;
    if(S.cat&&n.category!==S.cat)return false;
    if(S.tag&&!(n.tags||"").split(",").includes(S.tag))return false;
    if(S.kind==="pre"&&n.notice_kind!=="사전규격")return false;
    if(S.kind==="bid"&&n.notice_kind==="사전규격")return false;
    if(S.open){const d=dday(n.close_date);if(d!==null&&d<0)return false;}
    if(q&&!norm(n.title).toLowerCase().includes(q))return false;
    return true;
  });
  $("count").textContent=rows.length+"건 / 전체 "+DATA.length+"건";
  const el=$("list");
  if(!rows.length){el.innerHTML='<div class="empty">조건에 맞는 공고가 없습니다. 관심 키워드를 넓히거나 "관심 공고만"을 꺼보세요.</div>';return;}
  let html="",last="";
  const today=BUILT.slice(0,10);
  for(const n of rows){
    const day=(n.notice_date||"").slice(0,10);
    if(day!==last){html+=`<div class="day">${day} 공고</div>`;last=day;}
    const d=dday(n.close_date);
    let dd;
    if(d===null)dd='<div class="dd x">—</div>';
    else if(d<0)dd='<div class="dd x">마감</div>';
    else dd=`<div class="dd${d<=3?" u":""}">D-${d}<small>${n.close_date.slice(5,10)}</small></div>`;
    const tags=(n.tags||"").split(",").filter(Boolean).map(t=>`<span class="tag ${t}">${t}</span>`).join("");
    const pre=n.notice_kind==="사전규격"?'<span class="tag pre">사전규격</span>':"";
    const nw=n.first_seen===today?'<span class="tag new">NEW</span>':"";
    const meta=[n.institution, n.demand_institution&&n.demand_institution!==n.institution?n.demand_institution:"",
      n.close_date?(n.notice_kind==="사전규격"?"의견마감 ":"마감 ")+n.close_date:"",
      fmtWon(n.estimated_price||n.budget), (n.award_method||"").replace(/^(.+)-\1$/,"$1"), n.mk].filter((x,i,a)=>x&&a.indexOf(x)===i);
    let title;
    if(n.url)title=`<a class="t" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>`;
    else if(n.notice_kind==="사전규격")title=`<a class="t" href="https://www.g2b.go.kr/" target="_blank" rel="noopener" data-copy="${esc(n.notice_no||"")}" title="클릭하면 등록번호를 복사하고 나라장터를 엽니다">${esc(n.title)}</a>`;
    else title=`<span class="t">${esc(n.title)}</span>`;
    if(n.notice_kind==="사전규격"&&n.notice_no)meta.unshift("등록번호 "+n.notice_no);
    html+=`<div class="row">${dd}<div>${nw}${tags}${pre}${title}<div class="m"><span class="cat">${esc(n.category||"")}</span>${meta.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div></div>`;
  }
  el.innerHTML=html;
}
function syncUI(){
  $("q").value=S.q; $("matched").checked=S.matched; $("open").checked=S.open;
  for(const [id,key,attr] of [["cats","cat","cat"],["tags","tag","tag"],["kinds","kind","kind"]])
    document.querySelectorAll(`#${id} button`).forEach(b=>b.classList.toggle("on",b.dataset[attr]===S[key]));
}
function fillKw(){$("kwInc").value=KW.include.join("\n");$("kwExc").value=KW.exclude.join("\n");}
const doSearch=()=>{S.q=$("q").value;save(LS_S,S);render();};
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")doSearch();});
$("q").addEventListener("search",()=>{if(!$("q").value)doSearch();});  // x 버튼으로 지웠을 때
$("btnSearch").onclick=doSearch;
$("matched").addEventListener("change",e=>{S.matched=e.target.checked;save(LS_S,S);render();});
$("open").addEventListener("change",e=>{S.open=e.target.checked;save(LS_S,S);render();});
for(const [id,key,attr] of [["cats","cat","cat"],["tags","tag","tag"],["kinds","kind","kind"]]){
  $(id).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S[key]=b.dataset[attr];save(LS_S,S);syncUI();render();});
}
$("btnKw").onclick=()=>$("panel").classList.toggle("open");
$("btnClose").onclick=()=>$("panel").classList.remove("open");
$("btnSave").onclick=()=>{
  KW={include:$("kwInc").value.split("\n").map(s=>s.trim()).filter(Boolean),
      exclude:$("kwExc").value.split("\n").map(s=>s.trim()).filter(Boolean)};
  save(LS_KW,KW); judgeAll(); render();
  $("kwMsg").textContent="저장됨"; setTimeout(()=>$("kwMsg").textContent="",2500);
};
$("btnReset").onclick=()=>{KW=JSON.parse(JSON.stringify(DEFAULT_KW));localStorage.removeItem(LS_KW);fillKw();judgeAll();render();$("kwMsg").textContent="기본값으로 되돌림";setTimeout(()=>$("kwMsg").textContent="",2500);};
$("list").addEventListener("click",e=>{
  const a=e.target.closest("a[data-copy]");if(!a)return;
  navigator.clipboard&&navigator.clipboard.writeText(a.dataset.copy).catch(()=>{});
  const c=$("count"),old=c.textContent;c.textContent="등록번호 복사됨 — 나라장터 사전규격 검색창에 붙여넣기";setTimeout(()=>c.textContent=old,4000);
});
fillKw(); syncUI(); judgeAll(); render();
</script>
</body></html>
