<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>입찰공고 모니터</title>
<style>
:root{
  --bg:#f7f8fa;--panel:#fff;--ink:#172b4d;--ink2:#44546f;--ink3:#8590a2;--line:#dfe1e6;--hover:#f1f2f4;
  --acc:#0c66e4;--accbg:#e9f2ff;--warn:#c9372c;--warnbg:#ffeceb;--mid:#a54800;--midbg:#fff3e0;
  --lh:#1f845a;--gh:#5e4db2;--ih:#943d73;--sh:#a54800;--newbg:#dcfff1;--newfg:#216e4e;--prebg:#fff7d6;--prefg:#7f5f01;
  --sb:236px;--rowpad:9px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161a1d;--panel:#1d2125;--ink:#c7d1db;--ink2:#9fadbc;--ink3:#738496;--line:#2c333a;--hover:#22272b;
  --acc:#579dff;--accbg:#1c2b41;--warn:#f87168;--warnbg:#42221f;--mid:#f5a623;--midbg:#3a2e14;
  --lh:#4bce97;--gh:#9f8fef;--ih:#e774bb;--sh:#f5a623;--newbg:#1c3329;--newfg:#7ee2b8;--prebg:#332e1b;--prefg:#e2b203;
}}
*{box-sizing:border-box}
html{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.45;color:var(--ink);background:var(--bg)}
body{margin:0;display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ── 사이드바 ── */
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;padding:4px 8px 14px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--acc);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;left:6px;top:6px;width:10px;height:10px;border:2px solid #fff;border-radius:2px}
.nav h4{font-size:11px;color:var(--ink3);margin:14px 8px 4px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.nav button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:7px 8px;border:0;background:none;border-radius:6px;color:var(--ink2);font-size:13.5px;text-align:left}
.nav button:hover{background:var(--hover)}
.nav button.on{background:var(--accbg);color:var(--acc);font-weight:600}
.nav button span{color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
.nav button.on span{color:var(--acc)}
.nav .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:0}
.asof{margin:18px 8px 0;font-size:11.5px;color:var(--ink3);line-height:1.5}

/* ── 헤더 ── */
main{min-width:0}
.hd{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 24px 12px;position:sticky;top:0;z-index:3}
.hd h1{font-size:20px;margin:0 0 10px;font-weight:700;display:flex;align-items:baseline;gap:10px}
.hd h1 small{font-size:13px;color:var(--ink3);font-weight:400}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:4px;padding:0 8px;background:var(--panel);width:320px;max-width:100%}
.search input{border:0;background:none;padding:7px 2px;font:inherit;width:100%;color:var(--ink)}
.search input::placeholder{color:var(--ink3)}
.search svg{width:14px;height:14px;color:var(--ink3);flex:none}
select{border:1px solid var(--line);border-radius:4px;padding:6px 8px;font:inherit;font-size:13px;background:var(--panel);color:var(--ink2)}
.right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);border-radius:4px;padding:6px 12px;font-size:13px;background:var(--panel);color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.p:hover{filter:brightness(1.08)}
.dens{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.dens button{border:0;background:var(--panel);padding:5px 9px;font-size:13px;color:var(--ink3);line-height:1}
.dens button.on{background:var(--hover);color:var(--ink)}

/* ── 키워드 패널 ── */
#panel{display:none;background:var(--panel);border-bottom:1px solid var(--line)}
#panel.open{display:block}
.pin{padding:14px 24px;display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1100px}
.pin h2{font-size:13.5px;margin:0 0 4px;font-weight:600}.pin p{margin:0 0 6px;font-size:12.5px;color:var(--ink2)}
textarea{width:100%;height:150px;font:inherit;font-size:13px;line-height:1.5;border:1px solid var(--line);border-radius:4px;padding:8px 10px;resize:vertical;background:var(--bg);color:var(--ink)}
.pin .act{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg{font-size:13px;color:var(--newfg)}.note{font-size:12px;color:var(--ink3);grid-column:1/-1}

/* ── 표 ── */
.wrap{padding:16px 24px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--ink3);font-weight:600;text-align:left;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:var(--rowpad) 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
.d{display:inline-block;font-weight:700;padding:2px 8px;border-radius:3px;background:var(--hover);color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.d.u{background:var(--warnbg);color:var(--warn)}.d.m{background:var(--midbg);color:var(--mid)}
.d small{font-weight:400;font-size:11px;color:var(--ink3);margin-left:5px}
.lz{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;color:#fff;margin-right:5px;vertical-align:1px}
.LH{background:var(--lh)}.GH{background:var(--gh)}.IH{background:var(--ih)}.SH{background:var(--sh)}
.pre{background:var(--prebg);color:var(--prefg)}.new{background:var(--newbg);color:var(--newfg)}
.t{font-weight:600;color:var(--acc);text-decoration:none}
.t:hover{text-decoration:underline}
.t.x{color:var(--ink)}
.c{color:var(--ink2)}.r{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.kw{color:var(--ink3);font-size:12.5px}
.sub{color:var(--ink3);font-size:12px;margin-top:2px}
.empty{padding:60px 20px;text-align:center;color:var(--ink3)}
.pg{display:flex;justify-content:space-between;padding:10px 4px;color:var(--ink3);font-size:12.5px}
body.compact{--rowpad:5px}
body.compact td{font-size:13px}
body.compact .sub{display:none}

/* ── 모바일 ── */
.mnav{display:none}
@media (max-width:860px){
  body{grid-template-columns:1fr}
  aside{display:none}
  .hd{padding:12px 14px 10px;position:static}
  .hd h1{font-size:18px}
  .search{width:100%}
  .right{margin-left:0;width:100%}
  .dens{display:none}
  .mnav{display:flex;gap:4px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none;background:var(--panel);border-bottom:1px solid var(--line)}
  .mnav::-webkit-scrollbar{display:none}
  .mnav button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink2)}
  .mnav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .mnav button span{opacity:.7;margin-left:4px;font-size:12px}
  .wrap{padding:10px 14px 40px}
  .pin{grid-template-columns:1fr;padding:12px 14px}
  table,thead,tbody,tr,td{display:block}
  thead{display:none}
  tr{padding:11px 12px;border-bottom:1px solid var(--line)}
  td{padding:0;border:0;font-size:14px}
  td.c,td.r,td.kw{display:inline;margin-right:10px;font-size:12.5px}
  td.cat::before{content:"· "}
  td.dcell{margin-bottom:5px}
  td.tcell{margin-bottom:4px;line-height:1.4}
  .sub{display:inline}.sub::before{content:" / "}
  .t{color:var(--ink)}
}
</style>
</head>
<body>
<aside>
  <div class="brand"><i></i>입찰공고 모니터</div>
  <div class="nav" id="nav">
    <h4>뷰</h4>
    <button data-view="matched" class="on">관심 공고<span id="n-matched"></span></button>
    <button data-view="urgent">마감 임박 (7일)<span id="n-urgent"></span></button>
    <button data-view="new">오늘 신규<span id="n-new"></span></button>
    <button data-view="pre">사전규격<span id="n-pre"></span></button>
    <button data-view="all">전체<span id="n-all"></span></button>
    <h4>기관</h4>
    <button data-tag="" class="on">전체 기관</button>
    <button data-tag="LH"><b><i class="dot" style="background:var(--lh)"></i>LH</b><span id="n-LH"></span></button>
    <button data-tag="GH"><b><i class="dot" style="background:var(--gh)"></i>GH</b><span id="n-GH"></span></button>
    <button data-tag="IH"><b><i class="dot" style="background:var(--ih)"></i>IH</b><span id="n-IH"></span></button>
    <button data-tag="SH"><b><i class="dot" style="background:var(--sh)"></i>SH</b><span id="n-SH"></span></button>
    <h4>설정</h4>
    <button id="btnKw">내 관심 키워드</button>
    <button id="btnReset">회사 기본값으로</button>
  </div>
  <div class="asof">__DATE__ 갱신<br>최근 30일 · <span id="total"></span>건</div>
</aside>

<main>
  <div class="hd">
    <h1 id="vtitle">관심 공고 <small id="count"></small></h1>
    <div class="tb">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="공고명, 발주처 검색 후 엔터"></label>
      <select id="cat"><option value="">구분: 전체</option><option>공공기관</option><option>지자체</option><option>중앙정부</option><option>교육기관</option><option>기타</option></select>
      <select id="kind"><option value="">종류: 전체</option><option value="bid">입찰공고</option><option value="pre">사전규격</option></select>
      <select id="open"><option value="1">마감: 진행 중</option><option value="">마감: 전체</option></select>
      <div class="right">
        <div class="dens"><button id="dComf" title="보통">☰</button><button id="dComp" title="빽빽하게">≡</button></div>
        <button class="btn p" id="btnKw2">내 키워드</button>
      </div>
    </div>
  </div>
  <div class="mnav" id="mnav"></div>
  <div id="panel"><div class="pin">
    <div><h2>포함 키워드</h2><p>공고명에 하나라도 있으면 관심 공고. 한 줄에 하나.</p><textarea id="kwInc"></textarea></div>
    <div><h2>제외 키워드</h2><p>공고명에 있으면 제외. 한 줄에 하나.</p><textarea id="kwExc"></textarea></div>
    <div class="act"><button class="btn p" id="btnSave">저장</button><button class="btn" id="btnReset2">회사 기본값으로</button><button class="btn" id="btnClose">닫기</button><span class="msg" id="kwMsg"></span></div>
    <div class="note">키워드와 필터는 이 브라우저에만 저장됩니다. 다른 PC나 브라우저에서는 회사 기본값부터 시작합니다.</div>
  </div></div>
  <div class="wrap">
    <div class="card"><table>
      <thead><tr><th style="width:96px">마감</th><th>공고명</th><th style="width:200px">발주처</th><th style="width:80px">구분</th><th style="width:96px;text-align:right">추정가격</th><th style="width:110px">키워드</th></tr></thead>
      <tbody id="tb"></tbody>
    </table></div>
    <div class="pg"><span id="pgl"></span><span>__DATE__ 갱신</span></div>
  </div>
</main>

<script>
const DATA=__DATA__;
const DEFAULT_KW=__KW__;
const BUILT="__NOW__";
const NOW=new Date(BUILT);
const TODAY=BUILT.slice(0,10);
const LS_KW="bidmon.kw",LS_S="bidmon.filters2";
const VIEWS={matched:"관심 공고",urgent:"마감 임박",new:"오늘 신규",pre:"사전규격",all:"전체 공고"};
const $=id=>document.getElementById(id);
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
let KW=load(LS_KW,DEFAULT_KW);
const S=Object.assign({view:"matched",tag:"",q:"",cat:"",kind:"",open:"1",dens:"comf"},load(LS_S,{}));
const norm=s=>String(s||"").replace(/\s/g,"");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtWon=v=>v?Math.round(v/1e6).toLocaleString()+"백만":"";
const dday=c=>{if(!c)return null;return Math.floor((new Date(c.replace(" ","T"))-NOW)/864e5);};

function judge(n){const t=norm(n.title);const inc=KW.include.filter(k=>k&&t.includes(norm(k)));const exc=KW.exclude.some(k=>k&&t.includes(norm(k)));n.matched=inc.length>0&&!exc;n.mk=[...new Set(inc.map(norm))].join(", ");n.dd=dday(n.close_date);n.isNew=n.first_seen===TODAY;n.isPre=n.notice_kind==="사전규격";}
function judgeAll(){DATA.forEach(judge);}

function base(n){
  if(S.cat&&n.category!==S.cat)return false;
  if(S.kind==="pre"&&!n.isPre)return false;
  if(S.kind==="bid"&&n.isPre)return false;
  if(S.open&&n.dd!==null&&n.dd<0)return false;
  if(S.q){const q=norm(S.q).toLowerCase();if(!norm(n.title+" "+(n.institution||"")+" "+(n.demand_institution||"")).toLowerCase().includes(q))return false;}
  return true;
}
function inView(n,v){
  if(v==="all")return true;
  if(!n.matched)return false;
  if(v==="urgent")return n.dd!==null&&n.dd>=0&&n.dd<=7;
  if(v==="new")return n.isNew;
  if(v==="pre")return n.isPre;
  return true;
}
const hasTag=(n,t)=>!t||(n.tags||"").split(",").includes(t);

function counts(){
  const b=DATA.filter(base);
  for(const v of Object.keys(VIEWS))$("n-"+v).textContent=b.filter(n=>inView(n,v)&&hasTag(n,S.tag)).length.toLocaleString();
  for(const t of ["LH","GH","IH","SH"])$("n-"+t).textContent=b.filter(n=>inView(n,S.view)&&hasTag(n,t)).length||"";
  $("total").textContent=DATA.length.toLocaleString();
}

function render(){
  counts();
  const rows=DATA.filter(n=>base(n)&&inView(n,S.view)&&hasTag(n,S.tag)).sort((a,b)=>(b.notice_date||"").localeCompare(a.notice_date||""));
  $("vtitle").firstChild.textContent=VIEWS[S.view]+(S.tag?" · "+S.tag:"")+" ";
  $("count").textContent=rows.length.toLocaleString()+"건";
  $("pgl").textContent=rows.length?`1–${rows.length.toLocaleString()} / ${rows.length.toLocaleString()}건`:"";
  const tb=$("tb");
  if(!rows.length){tb.innerHTML='<tr><td colspan="6" class="empty">조건에 맞는 공고가 없습니다.</td></tr>';return;}
  tb.innerHTML=rows.map(n=>{
    const d=n.dd;
    const dc=d===null?'<span class="d">—</span>':d<0?'<span class="d">마감</span>':`<span class="d${d<=3?' u':d<=7?' m':''}">D-${d}<small>${n.close_date.slice(5,10)}</small></span>`;
    const tags=(n.tags||"").split(",").filter(Boolean).map(t=>`<span class="lz ${t}">${t}</span>`).join("");
    let title;
    if(n.url)title=`<a class="t" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>`;
    else if(n.isPre)title=`<a class="t" href="https://www.g2b.go.kr/" target="_blank" rel="noopener" data-copy="${esc(n.notice_no||"")}" title="클릭하면 등록번호를 복사하고 나라장터를 엽니다">${esc(n.title)}</a>`;
    else title=`<span class="t x">${esc(n.title)}</span>`;
    const inst=esc(n.institution||"")+(n.demand_institution&&n.demand_institution!==n.institution?`<div class="sub">${esc(n.demand_institution)}</div>`:"");
    const extra=n.isPre&&n.notice_no?`<span class="kw">등록번호 ${esc(n.notice_no)}</span>`:"";
    return `<tr><td class="dcell">${dc}</td><td class="tcell">${n.isNew?'<span class="lz new">NEW</span>':''}${tags}${n.isPre?'<span class="lz pre">사전규격</span>':''}${title}${extra?" "+extra:""}</td><td class="c">${inst}</td><td class="c cat">${esc(n.category||"")}</td><td class="r">${fmtWon(n.estimated_price||n.budget)}</td><td class="kw">${esc(n.mk)}</td></tr>`;
  }).join("");
}

function syncUI(){
  document.querySelectorAll("#nav [data-view]").forEach(b=>b.classList.toggle("on",b.dataset.view===S.view));
  document.querySelectorAll("#nav [data-tag]").forEach(b=>b.classList.toggle("on",b.dataset.tag===S.tag));
  $("q").value=S.q;$("cat").value=S.cat;$("kind").value=S.kind;$("open").value=S.open;
  document.body.classList.toggle("compact",S.dens==="comp");$("dComp").classList.toggle("on",S.dens==="comp");$("dComf").classList.toggle("on",S.dens!=="comp");
  $("mnav").innerHTML=Object.entries(VIEWS).map(([v,l])=>`<button data-view="${v}" class="${v===S.view?'on':''}">${l}<span>${$("n-"+v).textContent}</span></button>`).join("")+["LH","GH","IH","SH"].map(t=>`<button data-tag="${t}" class="${t===S.tag?'on':''}">${t}</button>`).join("");
}
function fillKw(){$("kwInc").value=KW.include.join("\n");$("kwExc").value=KW.exclude.join("\n");}
function update(){save(LS_S,S);render();syncUI();}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(b&&b.dataset.view!==undefined){S.view=b.dataset.view;update();return;}
  if(b&&b.dataset.tag!==undefined){S.tag=(S.tag===b.dataset.tag&&b.closest("#mnav"))?"":b.dataset.tag;update();return;}
  const a=e.target.closest("a[data-copy]");
  if(a){navigator.clipboard&&navigator.clipboard.writeText(a.dataset.copy).catch(()=>{});const c=$("count"),o=c.textContent;c.textContent="등록번호 복사됨 — 나라장터 사전규격 검색창에 붙여넣기";setTimeout(()=>c.textContent=o,4000);}
});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){S.q=$("q").value;update();}});
$("q").addEventListener("search",()=>{if(!$("q").value){S.q="";update();}});
document.addEventListener("keydown",e=>{if(e.key==="/"&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)){e.preventDefault();$("q").focus();}});
for(const id of ["cat","kind","open"])$(id).addEventListener("change",()=>{S[id]=$(id).value;update();});
$("dComp").onclick=()=>{S.dens="comp";update();};$("dComf").onclick=()=>{S.dens="comf";update();};
const togglePanel=()=>{$("panel").classList.toggle("open");};
$("btnKw").onclick=togglePanel;$("btnKw2").onclick=togglePanel;$("btnClose").onclick=()=>$("panel").classList.remove("open");
$("btnSave").onclick=()=>{KW={include:$("kwInc").value.split("\n").map(s=>s.trim()).filter(Boolean),exclude:$("kwExc").value.split("\n").map(s=>s.trim()).filter(Boolean)};save(LS_KW,KW);judgeAll();update();$("kwMsg").textContent="저장됨";setTimeout(()=>$("kwMsg").textContent="",2500);};
const reset=()=>{KW=JSON.parse(JSON.stringify(DEFAULT_KW));localStorage.removeItem(LS_KW);fillKw();judgeAll();update();$("kwMsg").textContent="회사 기본값으로 되돌림";setTimeout(()=>$("kwMsg").textContent="",2500);};
$("btnReset").onclick=reset;$("btnReset2").onclick=reset;
fillKw();judgeAll();render();syncUI();
</script>
</body></html>
